name: Dunnes cart probe

on:
  push:
    branches:
      - agent/dunnes-cart-probe
    paths:
      - .github/workflows/dunnes-cart-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run read-only Dunnes gateway probe via Vercel
        shell: bash
        run: |
          set -euo pipefail
          url='https://web-git-agent-dunnes-cart-probe-supermarket-ie.vercel.app/api/diagnostics/dunnes-cart-probe'
          status=$(curl -sS -L -o /tmp/probe.json -w '%{http_code}' "$url")
          echo "HTTP $status"
          cat /tmp/probe.json
          echo
          test "$status" = '200'
