name: Tesco stop-on-block patch

on:
  push:
    branches: [scrape-observability]
    paths:
      - '.github/workflows/tesco-stop-on-block-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: scrape-observability
      - name: Patch direct worker
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/tesco-direct-worker.ts')
          text = path.read_text()
          old_block = """      if (looksBlocked(html)) {\n        if (attempt < DEFAULT_FETCH_RETRIES) { await sleep(2_000); continue; }\n        return { ok: false, reason: 'blocked_challenge', error: 'Tesco challenge page returned to direct Vercel request' };\n      }\n"""
          new_block = """      if (looksBlocked(html)) {\n        // A confirmed Akamai/security challenge is an egress-level signal.\n        // Stop immediately: retrying or falling through to search only hammers\n        // an identity that now needs a 24-48 hour cooldown.\n        return { ok: false, reason: 'blocked_challenge', error: 'Tesco challenge page returned to direct Vercel request' };\n      }\n"""
          if old_block not in text:
              raise SystemExit('blocked-challenge retry snippet not found')
          text = text.replace(old_block, new_block, 1)

          old_fallthrough = """  }\n\n  const searchUrl = `${BASE_URL}/groceries/en-IE/search?query=${encodeURIComponent(product.canonicalName)}`;\n"""
          new_fallthrough = """  } else if (isTransient(productResult.reason)) {\n    // Transport failures belong to the egress/runtime layer. Do not issue a\n    // second Tesco request (search fallback) from the same failing identity.\n    throw new TransientTescoError(productResult.error, product, productResult.reason, 0, 0);\n  }\n\n  const searchUrl = `${BASE_URL}/groceries/en-IE/search?query=${encodeURIComponent(product.canonicalName)}`;\n"""
          if old_fallthrough not in text:
              raise SystemExit('direct-fetch fallthrough snippet not found')
          text = text.replace(old_fallthrough, new_fallthrough, 1)
          path.write_text(text)
      - run: rm .github/workflows/tesco-stop-on-block-patch.yml
      - name: Commit safety patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/tesco-direct-worker.ts .github/workflows/tesco-stop-on-block-patch.yml
          git commit -m 'fix: stop Tesco immediately on transport block'
          git push origin HEAD:scrape-observability
