name: Build & push BROWSER-TEST image to ECR

# MANUAL ONLY. Builds a one-off browser-enabled (Playwright/Chromium) image for
# the bounded Tesco browser-access acceptance test, and pushes it to ECR with a
# distinct `<sha>-browsertest` tag so it NEVER collides with the production
# image. Identical auth/build posture to aws-ecr-deploy-image.yml, plus
# INSTALL_BROWSER=1. Does NOT run terraform, DNS or ECS. Delete the image after
# the test if desired.

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS region"
        type: string
        required: true
        default: eu-west-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-ecr-browser-test-image
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push (browser-test)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: aws-prod
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: host
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create service-role key secret file (BuildKit secret source)
        run: |
          printf '%s' "${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}" > /tmp/svc_key
          echo "::add-mask::$(cat /tmp/svc_key)"

      - name: Build & push browser-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.host.outputs.sha }}-browsertest
          build-args: |
            BUILD_MODE=deploy
            BUILD_APP_ENV=production
            BUILD_SUPABASE_READ_ONLY=true
            NEXT_PUBLIC_SITE_URL=https://www.supermarket.ie
            NEXT_PUBLIC_BASE_URL=https://www.supermarket.ie
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.PROD_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.PROD_SUPABASE_ANON_KEY }}
            INSTALL_BROWSER=1
          secret-files: |
            supabase_service_role_key=/tmp/svc_key
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up secret file
        if: always()
        run: rm -f /tmp/svc_key

      - name: Report pushed tag
        run: echo "Pushed browser-test image ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.host.outputs.sha }}-browsertest"
