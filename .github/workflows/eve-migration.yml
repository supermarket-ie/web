name: Eve migration validation

on:
  push:
    branches:
      - eve-agent-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: eve-agent-runtime

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Eve and AI SDK 7
        run: |
          npm install --save --save-exact \
            eve@0.39.0 \
            ai@7.0.66 \
            @ai-sdk/anthropic@4.0.38 \
            @ai-sdk/react@4.0.69 \
            zod@4.4.3
          npm pkg set 'engines.node=>=24'
          npm pkg set 'scripts.build=eve build && next build'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Eve and Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          MAGIC_LINK_SECRET: ci-placeholder-secret
          CRON_SECRET: ci-placeholder-secret
          NEXT_PUBLIC_SITE_URL: https://example.com
          ANTHROPIC_API_KEY: ci-placeholder
          AI_GATEWAY_API_KEY: ci-placeholder

      - name: Commit dependency migration
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: migrate agent runtime to Eve and AI SDK 7"
          git push origin HEAD:eve-agent-runtime
