name: One-time Pepesto Tesco 250-product refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-pepesto-tesco-250.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate cron secret
        shell: bash
        run: test -n "${CRON_SECRET:-}"

      - name: Check Pepesto balance
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://supermarket.ie/api/cron/pepesto-bootstrap"

      - name: Submit demand-ranked Tesco refresh
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://supermarket.ie/api/workers/pepesto-tesco-submit?limit=250"
