name: Remove Sandbox dependency

on:
  push:
    branches: [scrape-observability]
    paths:
      - '.github/workflows/remove-sandbox-dependency.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: scrape-observability
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm uninstall @vercel/sandbox
      - run: rm .github/workflows/remove-sandbox-dependency.yml
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/remove-sandbox-dependency.yml
          git commit -m 'chore: remove unused Vercel Sandbox dependency'
          git push origin HEAD:scrape-observability
