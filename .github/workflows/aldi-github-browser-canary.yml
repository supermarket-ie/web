name: Aldi GitHub browser canary

on:
  push:
    branches: [scrape-observability]
    paths:
      - '.github/workflows/aldi-github-browser-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe Aldi dairy category
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const url = 'https://www.aldi.ie/products/chilled-food/dairy/k/1588161416978076002';
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ locale: 'en-IE' });
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(3000);
              const title = await page.title();
              const body = await page.locator('body').innerText().catch(() => '');
              const result = {
                http_status: response?.status() ?? 0,
                title,
                bytes: body.length,
                contains_target: /Irish Double Cream/i.test(body),
                access_denied: /Access Denied|don't have permission/i.test(body),
                preview: body.slice(0, 220),
              };
              console.log(JSON.stringify(result, null, 2));
              if (result.http_status !== 200 || result.access_denied || !result.contains_target) process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
