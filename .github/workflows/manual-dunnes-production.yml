name: Manual Dunnes production operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Dunnes production operation
        required: true
        default: catch-up
        type: choice
        options:
          - catch-up
          - alternative-canary
  push:
    branches: [main]
    paths:
      - .github/triggers/dunnes-production.txt

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate cron secret
        shell: bash
        run: test -n "${CRON_SECRET:-}"

      - name: Checkout operation marker
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Resolve operation
        id: operation
        shell: bash
        env:
          DISPATCH_OPERATION: ${{ github.event.inputs.operation }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            operation="${DISPATCH_OPERATION:-catch-up}"
          else
            operation="$(head -n 1 .github/triggers/dunnes-production.txt | tr -d '\r\n')"
          fi
          case "${operation}" in
            catch-up|alternative-canary) ;;
            *) echo "Unsupported Dunnes operation: ${operation}" >&2; exit 2 ;;
          esac
          echo "operation=${operation}" >> "$GITHUB_OUTPUT"

      - name: Trigger Dunnes stale-first production cycle
        if: steps.operation.outputs.operation == 'catch-up'
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://supermarket.ie/api/workers/dunnes-scrape-trigger?limit=275"

      - name: Trigger tightened Dunnes alternative validation
        if: steps.operation.outputs.operation == 'alternative-canary'
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://supermarket.ie/api/ops/dunnes-alternative-canary?limit=30"
