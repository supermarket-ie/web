name: Manual Dunnes production scrape

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  trigger:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == 'supermarket-ie' && github.event.issue.title == '[ops] Dunnes catch-up')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate cron secret
        shell: bash
        run: test -n "${CRON_SECRET:-}"
      - name: Trigger Dunnes stale-first production cycle
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://supermarket.ie/api/workers/dunnes-scrape-trigger?limit=275"
