name: Tesco Network Probe

on:
  push:
    branches:
      - scrape-observability

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe Tesco with standard Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({ locale: 'en-IE', viewport: { width: 1365, height: 768 } });
              const page = await context.newPage();
              const response = await page.goto('https://www.tesco.ie/groceries/en-IE/search?query=Butter%20Unsalted%20250g', { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(5000);
              const html = await page.content();
              const lower = html.toLowerCase();
              console.log(JSON.stringify({
                status: response ? response.status() : null,
                title: await page.title(),
                bytes: html.length,
                blocked: lower.includes('access denied') || lower.includes('security checks') || lower.includes('akamai') || lower.includes('captcha'),
                productLinks: await page.locator('a[href*="/products/"]').count(),
                hasPriceText: lower.includes('pricetext')
              }));
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
