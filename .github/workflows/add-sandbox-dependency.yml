name: Add Vercel Sandbox dependency

on:
  push:
    branches: [scrape-observability]
    paths:
      - '.github/workflows/add-sandbox-dependency.yml'

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: scrape-observability
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Add official Sandbox SDK
        run: npm install @vercel/sandbox --save-exact
      - name: Commit dependency files
        run: |
          git config user.name 'supermarket-ie'
          git config user.email 'colin@supermarket.ie'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes'
            exit 0
          fi
          git commit -m 'build: add Vercel Sandbox SDK'
          git push origin HEAD:scrape-observability
