name: CI

on:
  push:
    branches:
      - main
      - staging
      - scrape-observability
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Commit refreshed lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/scrape-observability'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: sync package lock [skip ci]"
            git push
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          MAGIC_LINK_SECRET: ci-placeholder-secret
          CRON_SECRET: ci-placeholder-secret
          NEXT_PUBLIC_SITE_URL: https://example.com
