name: AWS preview build & test

# Safe CI for the AWS migration. Builds and validates ONLY — it never deploys,
# never pushes an image to a registry, and touches no AWS/production resource.
# Triggered on the migration branch and PRs into it, plus manual dispatch.

on:
  push:
    branches:
      - infra/aws-migration
  pull_request:
    branches:
      - infra/aws-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, test & Next build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Behavioural release gate
        run: npm run test:behavioural

      - name: Scraper TypeScript checks
        run: |
          npm run typecheck:tesco-supervised
          npm run typecheck:tesco-discovery
          npm run typecheck:branded

      - name: Build (eve build && next build)
        run: npm run build
        env:
          # Non-secret placeholders. CI + the example Supabase URL activate the
          # app's empty-catalogue escape hatch, so the build needs no database.
          CI: "true"
          APP_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          MAGIC_LINK_SECRET: ci-placeholder-secret
          VENDOR_MAGIC_LINK_SECRET: ci-placeholder-secret
          CRON_SECRET: ci-placeholder-secret
          REVALIDATE_SECRET: ci-placeholder-secret
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://preview.invalid
          NEXT_PUBLIC_BASE_URL: https://preview.invalid

  docker:
    name: Docker image build (validation only, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image to prove the Dockerfile works end to end. The image is
      # NOT pushed anywhere — load=false, no registry login, no AWS credentials.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: supermarket-ie:preview-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform validate (no apply)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      # init without a backend and validate. No credentials, no plan against AWS.
      - name: Terraform init & validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
