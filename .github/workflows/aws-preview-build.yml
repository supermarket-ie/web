name: AWS preview build & test

# Safe CI for the AWS migration. Builds and validates ONLY — it never deploys,
# never pushes an image to a registry, and touches no AWS/production resource.
# Triggered on the migration branch and PRs into it, plus manual dispatch.

on:
  push:
    branches:
      - infra/aws-migration
  pull_request:
    branches:
      - infra/aws-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, test & Next build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Behavioural release gate
        run: npm run test:behavioural

      - name: Scraper TypeScript checks
        run: |
          npm run typecheck:tesco-supervised
          npm run typecheck:tesco-discovery
          npm run typecheck:branded

      - name: Build (eve build && next build)
        run: npm run build
        env:
          # Non-secret placeholders. CI + the example Supabase URL activate the
          # app's empty-catalogue escape hatch, so the build needs no database.
          CI: "true"
          APP_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          MAGIC_LINK_SECRET: ci-placeholder-secret
          VENDOR_MAGIC_LINK_SECRET: ci-placeholder-secret
          CRON_SECRET: ci-placeholder-secret
          REVALIDATE_SECRET: ci-placeholder-secret
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://preview.invalid
          NEXT_PUBLIC_BASE_URL: https://preview.invalid

  docker:
    name: Docker image build (validation only, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image to prove the Dockerfile works end to end, from the repo
      # root (context: .). BUILD_MODE=ci uses the placeholder + empty-catalogue
      # path so no database is needed. The image is NOT pushed — load=false, no
      # registry login, no AWS credentials. A deploy image is built separately
      # with BUILD_MODE=deploy and real NEXT_PUBLIC_* args (see docs/infra).
      - name: Build image (CI validation)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: supermarket-ie:preview-ci
          build-args: |
            BUILD_MODE=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the DEPLOY path builds end to end too: BUILD_MODE=deploy with real-
      # shaped (NON-production, NON-placeholder) NEXT_PUBLIC_* args and the
      # service-role key delivered via a BuildKit SECRET MOUNT (never a layer/ARG).
      # APP_ENV=preview makes the prerender read-only and tolerant of the absent
      # DB (renders empty), so no real database is needed to validate the build.
      # A dummy secret value is piped in to exercise the --mount=type=secret path.
      - name: Build image (deploy-mode validation)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: supermarket-ie:preview-deploy
          build-args: |
            BUILD_MODE=deploy
            NEXT_PUBLIC_SITE_URL=https://aws-preview.supermarket.ie
            NEXT_PUBLIC_BASE_URL=https://aws-preview.supermarket.ie
            NEXT_PUBLIC_SUPABASE_URL=https://deploy-verify.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-deploy-verify-anon
          secrets: |
            supabase_service_role_key=ci-deploy-verify-readonly-not-a-real-key
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Assert the deploy-mode image does NOT leak any build-arg/secret into
      # image history/metadata. (No secret should appear; NEXT_PUBLIC_* are
      # intentionally inlined into the app bundle, not image metadata.)
      - name: Verify no secret in image metadata
        run: |
          if docker history --no-trunc supermarket-ie:preview-deploy 2>/dev/null | grep -q "ci-deploy-verify-readonly-not-a-real-key"; then
            echo "SECRET LEAKED into image history" >&2; exit 1
          fi
          echo "No service-role secret found in image history (ok)."

  terraform:
    name: Terraform validate (no apply)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      # init without a backend and validate. No credentials, no plan against AWS.
      - name: Terraform init & validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
