name: SuperValu cart probe

on:
  push:
    branches:
      - agent/supervalu-cart-probe
    paths:
      - .github/workflows/supervalu-cart-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run read-only Storefront probe
        shell: bash
        run: |
          set -euo pipefail
          url='https://web-git-agent-supervalu-cart-probe-supermarket-ie.vercel.app/api/diagnostics/supervalu-cart-probe?q=milk'
          status=$(curl -sS -L -o /tmp/probe.json -w '%{http_code}' "$url")
          echo "HTTP $status"
          cat /tmp/probe.json
          echo
          test "$status" = '200'
