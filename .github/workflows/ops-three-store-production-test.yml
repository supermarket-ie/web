name: One-off three-store production scrape test

on:
  push:
    branches:
      - ops-three-store-production-test-20260818
    paths:
      - .github/workflows/ops-three-store-production-test.yml

permissions:
  contents: read

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate production cron secret
        shell: bash
        run: |
          if [ -z "${CRON_SECRET:-}" ]; then
            echo 'CRON_SECRET is not configured in the GitHub production environment.'
            exit 1
          fi
      - name: Trigger Dunnes production cycle
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://supermarket.ie/api/workers/dunnes-scrape-trigger?limit=1000"
      - name: Trigger SuperValu production cycle
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://supermarket.ie/api/workers/supervalu-scrape-trigger?limit=1000"

  aldi-full:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REFRESH_MODE: full
      SCRAPE_RUN_ID: gha_aldi_full_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate required secret
        shell: bash
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo 'SUPABASE_SERVICE_ROLE_KEY is not configured in the GitHub production environment.'
            exit 1
          fi
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Aldi refresh
        run: node scripts/aldi_scraper.js --refresh
